[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "recall-local"
version = "0.1.0"
description = "Local hybrid retrieval for agent history and source code"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "xzl01"}]
dependencies = ["numpy>=1.24,<3", "tokenizers>=0.20,<1"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Text Processing :: Indexing",
]

[project.optional-dependencies]
# 两套推理后端，按平台选：Apple Silicon 用 MLX，其余（Intel / Linux）用 OpenVINO。
# RECALL_BACKEND=auto（默认）会挑当前平台该用的那个。
mlx = ["mlx>=0.14,<1", "safetensors>=0.4,<1"]
openvino = ["openvino>=2024.4,<2027"]
# 第三套后端，只在 RECALL_BACKEND=gguf 时启用。llama-cpp-python 没有预编译轮子，
# 安装时会就地编译，需要 C++ 工具链和 cmake。
gguf = ["llama-cpp-python>=0.3,<1", "gguf>=0.10,<1"]
# DSH 的会话是 zstd 压缩的。Python 3.14+ 自带 compression.zstd，更早的版本需要它。
dsh = ["zstandard>=0.22,<1"]
# 只用于 OpenVINO 那条路：把 BGE 导出成 IR（需要 torch 与 optimum-intel）。
setup = ["openvino>=2024.4,<2027", "optimum-intel>=2.2,<3", "transformers>=4.44,<5", "torch>=2,<3", "huggingface-hub>=0.26,<1"]
dev = ["pytest>=8,<10", "build>=1,<2", "ruff>=0.12,<1", "zstandard>=0.22,<1"]

[project.scripts]
recall = "recall.cli:main"

[project.urls]
Repository = "https://github.com/xzl01/recall"
Issues = "https://github.com/xzl01/recall/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
